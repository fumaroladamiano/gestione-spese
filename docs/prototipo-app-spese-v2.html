<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spese · Prototipo UI v2</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spese">
<meta name="theme-color" content="#F3F3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<style>
/* =====================================================================
   Prototipo — direzione "iOS raffinato"
   Riferimento visivo da implementare (proposta § 1.5) · lingua IT/EN
   ===================================================================== */
:root{--s:1;--page-bg:#E9E9F0;--page-bg2:#F8F8FB;--page-fg:#1D1D1F;--page-muted:#6E6E73;--page-card:#FFFFFF;--page-line:#D8D8E0;--page-tint:#5856D6}
html[data-theme="dark"]{--page-bg:#050507;--page-bg2:#17171C;--page-fg:#F5F5F7;--page-muted:#98989F;--page-card:#1C1C1E;--page-line:#34343A;--page-tint:#5E5CE6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--page-fg);background:radial-gradient(900px 700px at 70% 15%,color-mix(in srgb,var(--page-tint) 10%,var(--page-bg2)),transparent 70%),radial-gradient(1200px 800px at 65% 20%,var(--page-bg2),var(--page-bg));overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
svg.ic{display:block;flex:none}

/* ---------- Pagina esterna ---------- */
.stage{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;gap:clamp(28px,5vw,80px);padding:20px}
.side{width:310px;flex:none;max-height:100%;overflow-y:auto;scrollbar-width:none}
.badge{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--page-tint);background:color-mix(in srgb,var(--page-tint) 14%,transparent);padding:4px 10px;border-radius:99px}
.side h1{font-size:40px;line-height:1.05;margin:14px 0 8px;letter-spacing:-.03em}
.side p{color:var(--page-muted);margin:0 0 20px}
.side h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--page-muted);margin:0 0 8px}
.side ol{margin:0 0 22px;padding-left:20px;display:grid;gap:7px;color:var(--page-muted)}
.side ol b{color:var(--page-fg);font-weight:600}
.theme-switch{display:flex;gap:4px;background:var(--page-card);border:1px solid var(--page-line);padding:4px;border-radius:12px;width:max-content}
.theme-switch button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--page-muted)}
.theme-switch button.on{background:var(--page-tint);color:#fff}
.side .foot{margin-top:20px;font-size:12px;color:var(--page-muted)}
.side code{font-size:12px;background:var(--page-card);border:1px solid var(--page-line);padding:1px 5px;border-radius:5px}
.side-ctrls{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.btn-side{padding:7px 12px;border-radius:10px;border:1px solid var(--page-line);background:var(--page-card);font-size:13px;font-weight:500;width:max-content;color:var(--page-fg)}
.btn-side:active{opacity:.7}

.phone-box{position:relative;flex:none;width:calc(421px * var(--s));height:calc(880px * var(--s))}
.phone{position:absolute;top:0;left:0;width:421px;height:880px;padding:14px;border-radius:70px;background:linear-gradient(145deg,#3a3a3c,#111113 40%,#2a2a2c);box-shadow:inset 0 0 0 2px #4a4a4d,inset 0 0 0 5px #111,0 60px 120px -40px rgba(20,18,60,.55),0 0 0 1px rgba(0,0,0,.25);transform:scale(var(--s));transform-origin:0 0}

/* ---------- Schermo e token ---------- */
.screen{
  -webkit-touch-callout:none;
  --sat:54px;--sab:34px;
  --bg:#F3F3F8;--surface:#FFFFFF;--surface2:#FFFFFF;--fill:#E6E6EE;--fill2:rgba(118,118,140,.12);
  --label:#0B0B12;--label2:#6B6B74;--label3:#B8B8C2;--sep:rgba(60,60,67,.13);
  --tint:#5856D6;--tint-fill:#5856D6;--tint-soft:#ECECFD;--pos:#34C759;--warn:#FF9500;--neg:#FF3B30;
  --pos-text:#1F7A36;--warn-text:#C93400;--neg-text:#D70015;
  --bar-bg:rgba(255,255,255,.72);--key:#FFFFFF;--seg-on:#FFFFFF;--bar-neutral:#D9D9E2;
  --shadow:0 1px 2px rgba(18,18,40,.04),0 8px 24px -14px rgba(18,18,40,.16);
  --shadow-float:0 1px 1px rgba(18,18,40,.05),0 12px 32px -10px rgba(18,18,40,.22);
  --hero:linear-gradient(150deg,#6260E8 0%,#5856D6 48%,#3E3CB6 100%);
  --r-xs:8px;--r-sm:10px;--r-md:16px;--r-lg:22px;--r-xl:28px;--r-full:999px;
  position:relative;width:393px;height:852px;border-radius:56px;overflow:hidden;background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:17px;line-height:1.3;letter-spacing:-.01em;color:var(--label);user-select:none;-webkit-user-select:none
}
.screen[data-theme="dark"]{
  --bg:#000000;--surface:#161618;--surface2:#242427;--fill:#2C2C2F;--fill2:rgba(118,118,128,.24);
  --label:#F5F5F7;--label2:#9A9AA2;--label3:#4A4A51;--sep:rgba(84,84,88,.45);
  --tint:#8E8CF8;--tint-fill:#5E5CE6;--tint-soft:#1E1D40;--pos:#30D158;--warn:#FF9F0A;--neg:#FF453A;
  --pos-text:#30D158;--warn-text:#FF9F0A;--neg-text:#FF6961;
  --bar-bg:rgba(36,36,40,.72);--key:#2A2A2E;--seg-on:#5A5A60;--bar-neutral:#3A3A40;
  --shadow:0 0 0 .5px rgba(255,255,255,.06);
  --shadow-float:0 0 0 .5px rgba(255,255,255,.1),0 16px 36px -12px rgba(0,0,0,.8);
  --hero:linear-gradient(150deg,#5F5DE6 0%,#4543C2 55%,#2C2A8E 100%)
}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:200;pointer-events:none}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;padding:17px 28px 0 50px;display:flex;justify-content:space-between;font-size:16px;font-weight:600;z-index:150;pointer-events:none;color:var(--label);transition:color .3s}
.sb-icons{display:flex;gap:6px;align-items:center;height:20px}
.home-ind{position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:var(--label);z-index:210;pointer-events:none}
.root{position:absolute;inset:0;background:var(--bg);overflow:hidden;transform-origin:50% 0;transition:transform .45s cubic-bezier(.32,.72,0,1),border-radius .45s}
.screen.sheet-open .root{transform:translateY(calc(var(--sat) - 8px)) scale(.915);border-radius:var(--r-xl)}
.screen.sheet-open .statusbar{color:#fff}
.page-host,.page{position:absolute;inset:0}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:var(--sat) 0 calc(104px + var(--sab));scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.scroll.under-nav{padding-top:calc(var(--sat) + 52px)}
.amount{font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* nav compatta */
.cnav{position:absolute;top:0;left:0;right:0;height:calc(var(--sat) + 44px);z-index:40;background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep);opacity:0;transition:opacity .2s;pointer-events:none}
.cnav.show{opacity:1;pointer-events:auto}
.cnav-inner{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;justify-content:center}
.cnav-title{font-weight:600;font-size:17px}
.back{position:absolute;left:6px;display:flex;align-items:center;color:var(--tint);font-size:17px;height:44px}
.nav-icon{position:absolute;right:10px;color:var(--tint);width:36px;height:36px;border-radius:50%;background:var(--tint-soft);display:grid;place-items:center}

.lt-wrap{padding:6px 20px 14px}
.lt-caption{font-size:15px;font-weight:500;color:var(--label2);letter-spacing:-.01em}
.lt{font-size:34px;line-height:41px;font-weight:800;letter-spacing:-.025em;margin:0}

/* card e liste */
.card{background:var(--surface);border-radius:var(--r-lg);margin:0 16px;box-shadow:var(--shadow)}
.card.pad{padding:16px 18px}
.eyebrow{font-size:14px;font-weight:500;color:var(--label2);letter-spacing:-.01em}
.muted{color:var(--label2)}
.small{font-size:13px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;padding:26px 20px 10px;font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--label)}
.section-h.sm{font-size:13px;font-weight:600;color:var(--label2);letter-spacing:0;padding:22px 32px 8px}
.section-foot{padding:8px 32px 0;font-size:13px;color:var(--label2);line-height:1.4}
.link{color:var(--tint);font-size:15px;font-weight:600;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:2px}
.list{overflow:hidden;--inset:68px}
.list.settings{--inset:60px}
.list>*{position:relative}
.list>*+*::before{content:"";position:absolute;top:0;right:0;left:var(--inset);height:.5px;background:var(--sep);z-index:3}
.row{position:relative;display:flex;align-items:center;gap:14px;min-height:48px;padding:11px 16px;width:100%;background:var(--surface);text-align:left}
button.row:active,.swipe-content:active{background:color-mix(in srgb,var(--label) 6%,var(--surface))}
.row-main{flex:1;min-width:0}
.row-title{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;letter-spacing:-.015em}
.row-title span.t{overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-amount{font-size:17px;font-weight:650;white-space:nowrap}
.row .value{color:var(--label2);white-space:nowrap}
.chev{color:var(--label3)}
.rec{color:var(--tint);display:inline-flex;flex:none}
/* icone categoria: squircle tenue con glifo colorato */
.cat-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--c,#8E8E93);background:color-mix(in srgb,var(--c,#8E8E93) 15%,var(--surface))}
.screen[data-theme="dark"] .cat-ic{background:color-mix(in srgb,var(--c,#8E8E93) 22%,var(--surface))}
.cat-ic.sm{width:32px;height:32px;border-radius:10px}
.cat-ic.solid{background:var(--c);color:#fff}
.set-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;background:var(--c);box-shadow:inset 0 -8px 12px -8px rgba(0,0,0,.18)}
.row.tint{color:var(--tint);font-weight:500}
.row.danger{color:var(--neg);justify-content:center;font-weight:500}
.row.stack{flex-wrap:wrap;row-gap:10px}
.row.stack .seg{flex-basis:calc(100% - 46px);margin-left:46px}

/* swipe */
.swipe{overflow:hidden;background:var(--surface);transition:height .26s ease,opacity .26s ease}
.swipe.removing{opacity:0}
.swipe-actions{position:absolute;top:0;right:0;bottom:0;display:flex;z-index:0;visibility:hidden}
.swipe.reveal .swipe-actions{visibility:visible}
.sa{width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:12px;font-weight:600}
.sa.edit{background:var(--tint-fill)}
.sa.del{background:var(--neg)}
.swipe-content{z-index:1;transition:transform .32s cubic-bezier(.2,.8,.2,1);touch-action:pan-y;cursor:pointer;min-height:64px}

/* home: hero del mese */
.hero{position:relative;margin:0 16px;padding:18px 20px 18px;border-radius:var(--r-xl);background:var(--hero);color:#fff;cursor:pointer;overflow:hidden;box-shadow:0 18px 36px -18px rgba(76,74,210,.75),inset 0 1px 0 rgba(255,255,255,.18)}
.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);pointer-events:none}
.hero::after{content:"";position:absolute;left:-40px;bottom:-120px;width:260px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,10,90,.35),transparent);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero .eyebrow{color:rgba(255,255,255,.95);font-weight:600}
.hero-go{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.hero-amount{font-size:48px;line-height:1.05;font-weight:700;margin:8px 0 12px;letter-spacing:-.035em}
.hero-amount .dec{font-size:28px;font-weight:600;opacity:.72}
.hero-amount .cur{font-size:30px;font-weight:600;opacity:.8}
.delta{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap;color:var(--label2)}
.hero .delta{color:rgba(255,255,255,.95)}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.up{color:var(--neg-text);background:color-mix(in srgb,var(--neg) 14%,transparent)}
.pill.down{color:var(--pos-text);background:color-mix(in srgb,var(--pos) 16%,transparent)}
.pill.neutral{color:var(--label2);background:var(--fill2)}
.hero .pill{background:rgba(255,255,255,.2);color:#fff}
.progress{height:10px;border-radius:5px;background:var(--fill2);overflow:hidden;margin-top:16px}
.progress i{display:block;height:100%;border-radius:5px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.hero .progress{background:rgba(255,255,255,.22);height:8px;margin-top:18px}
.budget-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--label2);margin-top:7px;gap:8px}
.hero .budget-meta{color:rgba(255,255,255,.95)}
.budget-meta b{font-weight:600}

/* bento */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 16px 0}
.duo .card{margin:0;padding:14px 16px;min-height:112px;display:flex;flex-direction:column}
.tile-top{display:flex;align-items:center;gap:8px}
.tile-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--tint);background:var(--tint-soft)}
.mini-amount{font-size:24px;font-weight:700;margin-top:auto;letter-spacing:-.03em}
.mini-sub{font-size:12px;color:var(--label2);margin-top:2px}
.spark{display:flex;align-items:flex-end;gap:4px;height:26px;margin-top:10px}
.spark i{flex:1;border-radius:3px;background:color-mix(in srgb,var(--tint) 30%,var(--fill));min-height:3px}
.spark i.today{background:var(--tint)}
.topcat{display:flex;align-items:center;gap:12px;padding:8px 0}
.tc-main{flex:1;min-width:0}
.tc-line{display:flex;justify-content:space-between;font-size:15px;font-weight:500;margin-bottom:7px;gap:8px}
.tc-line .amount{font-weight:650}
.tc-line .pct{color:var(--label2);font-weight:500;margin-left:6px;font-size:13px}
.tc-bar{height:7px;border-radius:4px;background:var(--fill2);overflow:hidden}
.tc-bar i{display:block;height:100%;border-radius:4px}

/* chip */
.chips-bar{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none}
.chips-bar::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-full);background:var(--surface);box-shadow:var(--shadow);font-size:15px;font-weight:500;white-space:nowrap;color:var(--label);transition:background .2s,color .2s,box-shadow .2s}
.chip .caret{opacity:.5;margin-left:-2px}
.chip.on{background:var(--tint-fill);color:#fff;box-shadow:0 6px 14px -8px var(--tint)}
.chip.on .caret{opacity:.8}
.chip.plain{background:transparent;box-shadow:none;color:var(--tint);padding:0 6px;font-weight:600}
.chip.soft{background:var(--fill2);box-shadow:none}
.chip.soft.on{background:var(--tint-soft);color:var(--tint);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--tint) 40%,transparent)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on .dot{box-shadow:0 0 0 1.5px #fff}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}

/* storico */
.total-sticky{position:sticky;top:calc(var(--sat) + 52px);z-index:20;display:flex;align-items:center;justify-content:space-between;margin:10px 16px 4px;padding:12px 18px;border-radius:var(--r-lg);background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--shadow-float)}
.total-amount{font-size:24px;font-weight:700;letter-spacing:-.03em}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:22px 32px 8px;font-size:15px;font-weight:600;color:var(--label);letter-spacing:-.01em}
.day-h .amount{color:var(--label2);font-weight:600;font-size:14px}
.empty{text-align:center;padding:44px 32px;color:var(--label2)}
.empty .big-ic{display:grid;place-items:center;width:72px;height:72px;margin:0 auto;border-radius:24px;background:var(--tint-soft);color:var(--tint)}
.empty h3{color:var(--label);font-size:20px;margin:14px 0 4px;letter-spacing:-.02em}
.empty p{margin:0 0 18px;font-size:15px}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:var(--r-md);background:var(--hero);color:#fff;font-size:17px;font-weight:600;box-shadow:0 12px 24px -14px var(--tint)}
.btn-primary:active{transform:scale(.98);opacity:.92}
.btn-tinted{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 18px;border-radius:var(--r-md);background:var(--tint-soft);color:var(--tint);font-weight:600;font-size:15px}

/* grafici */
.month-switch{display:flex;align-items:center;justify-content:space-between;margin:0 16px;padding:5px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow)}
.month-switch button,.ms-inline button{width:40px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--tint);background:var(--tint-soft)}
.month-switch button:disabled,.ms-inline button:disabled{color:var(--label3);background:var(--fill2);cursor:default}
.ms-label{font-weight:650;letter-spacing:-.01em}
.sum-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big-amount{font-size:36px;font-weight:700;line-height:1.15;margin-top:2px;letter-spacing:-.035em}
.donut-wrap{position:relative;width:212px;height:212px;margin:6px auto 10px}
.donut{width:100%;height:100%;display:block}
.donut circle{transition:stroke-width .25s,opacity .25s;cursor:pointer}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.dc-amount{font-size:24px;font-weight:700;letter-spacing:-.03em}
.dc-label{font-size:13px;color:var(--label2);max-width:120px;font-weight:500}
.legend-row{display:flex;align-items:center;gap:12px;width:100%;padding:9px 0;transition:opacity .2s}
.lg-name{flex:1;font-size:16px;font-weight:500}
.lg-pct{color:var(--label2);font-size:13px;font-weight:600;min-width:46px;text-align:center;padding:2px 0;border-radius:8px;background:var(--fill2)}
.lg-amt{font-weight:650;font-size:16px;min-width:92px;text-align:right}
.legend-row.faded{opacity:.38}
.bars{width:100%;height:auto;display:block;overflow:visible}
.bar-head{display:flex;justify-content:space-between;align-items:baseline;min-height:24px;margin-bottom:8px;gap:8px}
.chart-link{display:flex;justify-content:center;padding-top:12px}

/* impostazioni */
.inline-input{width:120px;text-align:right;border:0;background:transparent;font-size:17px;color:var(--label2);outline:none;padding:0}
.inline-input:focus{color:var(--tint)}
.seg{display:flex;background:var(--fill2);border-radius:var(--r-sm);padding:2px}
.seg button{flex:1;height:32px;border-radius:var(--r-xs);font-size:13px;font-weight:500;text-align:center;transition:background .2s}
.seg button.on{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:650}
.value.ok{color:var(--pos-text)}
.value.warn{color:var(--warn-text)}

/* tab bar flottante */
.tabbar{position:absolute;left:14px;right:14px;bottom:max(calc(var(--sab) - 8px),10px);height:64px;padding:0 6px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-radius:var(--r-full);background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:var(--shadow-float),inset 0 .5px 0 rgba(255,255,255,.5);z-index:50}
.screen[data-theme="dark"] .tabbar{box-shadow:var(--shadow-float),inset 0 .5px 0 rgba(255,255,255,.08)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:54px;border-radius:var(--r-full);font-size:10px;font-weight:600;color:var(--label2);transition:color .2s,background .25s}
.tab.on{color:var(--tint);background:var(--tint-soft)}
.tab-add{display:flex;justify-content:center;align-items:center}
.tab-add span{width:52px;height:52px;border-radius:50%;background:var(--hero);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px -8px var(--tint),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s}
.tab-add:active span{transform:scale(.9)}

/* fogli */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .35s;z-index:80}
.dim.show{opacity:1;pointer-events:auto}
.screen.sheet-open .dim{background:rgba(0,0,0,.2)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 4px);z-index:90;background:var(--bg);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .45s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden}
.sheet.open{transform:none}
.sheet.small{top:auto;max-height:78%}
.sheet.action{background:transparent;padding:0 10px max(var(--sab),12px);border-radius:0}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--label3);margin:7px auto 0;flex:none}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:50px;padding:0 16px;flex:none}
.sheet-head>:first-child{justify-self:start}
.sheet-head>:last-child{justify-self:end}
.sheet-title{font-weight:650;font-size:17px}
.nav-btn{color:var(--tint);font-size:17px;padding:8px 0}
.nav-btn.strong{font-weight:600;color:#fff;background:var(--tint-fill);padding:7px 16px;border-radius:var(--r-full);transition:background .2s,color .2s}
.nav-btn.strong.disabled{background:var(--fill2);color:var(--label3)}
.nav-btn.disabled{color:var(--label3)}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding-bottom:20px;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-foot{flex:none;padding:12px 16px max(var(--sab),16px);background:var(--bg)}

/* inserimento */
.amount-display{text-align:center;font-size:60px;font-weight:700;line-height:1.1;padding:8px 12px 18px;white-space:nowrap;letter-spacing:-.04em}
.amount-display.fit{font-size:46px}
.amount-display .ghost{color:var(--label3)}
.amount-display .cur{font-size:36px;color:var(--label2);font-weight:600}
.shake{animation:shake .34s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 6px;padding:0 12px}
.cat-cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;border-radius:16px;min-width:0}
.cat-cell .cat-ic{width:54px;height:54px;border-radius:18px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s,box-shadow .2s}
.cat-name{font-size:12px;font-weight:500;color:var(--label2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-cell.on .cat-ic{background:var(--c);color:#fff;transform:scale(1.06);box-shadow:0 0 0 3px var(--bg),0 0 0 5px color-mix(in srgb,var(--c) 45%,transparent),0 10px 18px -8px var(--c)}
.cat-cell.on .cat-name{color:var(--label);font-weight:650}
.detail-chips{display:flex;gap:8px;padding:16px 16px 0;flex-wrap:wrap}
.date-row{display:flex;gap:8px;align-items:center;padding:10px 16px 0}
.date-input{height:36px;border-radius:var(--r-full);border:0;background:var(--surface);box-shadow:var(--shadow);padding:0 12px;color:var(--label);font-size:15px;color-scheme:light;outline:none}
.screen[data-theme="dark"] .date-input{color-scheme:dark}
.note-input,.field{display:block;width:calc(100% - 32px);margin:12px 16px 0;height:48px;border-radius:16px;border:0;background:var(--surface);box-shadow:var(--shadow);padding:0 16px;font-size:17px;color:var(--label);outline:none;user-select:text;-webkit-user-select:text;transition:box-shadow .2s}
.note-input:focus,.field:focus{box-shadow:0 0 0 2px var(--tint)}
.field{width:100%;margin:0}
.note-input::placeholder,.field::placeholder{color:var(--label3)}
.danger-link{display:block;margin:18px auto 0;color:var(--neg);font-size:17px;font-weight:500;padding:8px 16px}
.keypad{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px max(var(--sab),12px);background:var(--bg)}
.key{height:52px;border-radius:16px;background:var(--key);font-size:26px;font-weight:500;display:grid;place-items:center;text-align:center;box-shadow:var(--shadow);transition:background .08s,transform .08s;font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif}
.key.fn{background:var(--fill2);box-shadow:none;color:var(--label2)}
.key:active,.key.pressed{background:var(--tint-soft);color:var(--tint);transform:scale(.95)}

/* filtri */
.ms-inline{display:flex;align-items:center;justify-content:space-between}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding-top:12px;margin-top:12px;border-top:.5px solid var(--sep);width:100%;font-weight:500}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.switch.on{background:var(--pos)}
.switch.on::after{transform:translateX(20px)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;text-align:center}
.cal .wd{font-size:12px;font-weight:600;color:var(--label2);padding:2px 0 6px}
.cal button{position:relative;width:40px;height:40px;margin:0 auto;border-radius:13px;font-size:16px;font-weight:500;text-align:center;font-variant-numeric:tabular-nums}
.cal button.has::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--tint);opacity:.7}
.cal button.today{color:var(--tint);font-weight:700;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--tint) 45%,transparent)}
.cal button.on{background:var(--tint-fill);color:#fff;box-shadow:0 8px 16px -8px var(--tint)}
.cal button.on::after{background:#fff;opacity:1}
.cal button:disabled{color:var(--label3);cursor:default}

/* categoria */
.ce-preview{display:grid;place-items:center;padding:6px 0 18px}
.ce-preview .cat-ic{width:84px;height:84px;border-radius:28px;box-shadow:0 16px 30px -14px var(--c)}
.swatches,.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.swatch{aspect-ratio:1;border-radius:50%;background:var(--c)}
.swatch.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.icon-opt{aspect-ratio:1;border-radius:13px;display:grid;place-items:center;background:var(--fill2);color:var(--label2)}
.icon-opt.on{background:var(--c);color:#fff}
.note{font-size:13px;color:var(--label2);padding:10px 16px 0;line-height:1.4}

/* action sheet */
.as-card{background:color-mix(in srgb,var(--surface2) 92%,transparent);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:22px;overflow:hidden;text-align:center}
.as-title{padding:16px 16px 4px;font-size:13px;font-weight:650;color:var(--label2)}
.as-msg{padding:0 16px 14px;font-size:13px;color:var(--label2)}
.as-btn{display:block;width:100%;height:56px;font-size:19px;color:var(--tint);text-align:center;box-shadow:0 -.5px 0 var(--sep)}
.as-btn.danger{color:var(--neg)}
.as-cancel{margin-top:8px;font-weight:650;border-radius:22px;box-shadow:none;background:var(--surface2)}

/* PWA: installazione */
.install-banner{display:flex;gap:12px;align-items:center;padding:12px 8px 12px 12px;margin:0 16px 14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow),inset 0 0 0 1.5px color-mix(in srgb,var(--tint) 30%,transparent);cursor:pointer}
.ib-ic{width:42px;height:42px;border-radius:13px;background:var(--hero);color:#fff;display:grid;place-items:center;flex:none}
.ib-title{font-weight:650;font-size:15px}

.guide-hero{text-align:center;padding:8px 28px 22px}

.guide-hero h2{margin:0 0 6px;font-size:28px;letter-spacing:-.025em}

.row.step{align-items:flex-start;padding:14px 16px}
.step-n{width:28px;height:28px;border-radius:var(--r-xs);background:var(--tint-soft);color:var(--tint);font-size:14px;font-weight:700;display:grid;place-items:center;flex:none}
.step-t{font-size:16px;line-height:1.45}
.kbd-ic{display:inline-grid;place-items:center;vertical-align:-6px;width:26px;height:26px;border-radius:8px;background:var(--fill2);color:var(--tint);margin:0 2px}
.callout{display:flex;gap:10px;margin:16px 16px 0;padding:14px;border-radius:var(--r-md);background:color-mix(in srgb,var(--warn) 13%,var(--surface));font-size:14px;line-height:1.45}
.callout .ic{color:var(--warn);margin-top:1px}

.toast{position:absolute;left:16px;right:16px;bottom:calc(max(calc(var(--sab) - 8px),10px) + 76px);z-index:120;display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r-md);background:rgba(28,28,34,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;font-size:15px;transform:translateY(16px) scale(.98);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;box-shadow:0 14px 34px -12px rgba(0,0,0,.55)}
.screen[data-theme="dark"] .toast{background:rgba(58,58,64,.96)}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.t-msg{flex:1}
.toast button{color:#B3B2FF;font-weight:650}

/* responsive */
@media (max-width:980px){.side{display:none}}
@media (max-width:520px){
  body{background:#000}
  .stage{padding:0}
  .phone-box{width:100vw;height:100vh;height:100dvh}
  .phone{position:static;width:100%;height:100%;padding:0;border-radius:0;background:none;box-shadow:none;transform:none}
  .screen{width:100%;height:100%;border-radius:0;--sat:max(env(safe-area-inset-top),12px);--sab:env(safe-area-inset-bottom)}
  .island,.statusbar,.home-ind{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}

let fmtEUR, fmtEUR0, fmtNum2, fmtPct, fmtPctSigned, MONTHS, MONTHS_SHORT, DAYS, DAYS_SHORT, DEC_SEP;
function setupLocale() {
  const loc = t('locale');
  fmtEUR = new Intl.NumberFormat(loc, { style:'currency', currency:'EUR', useGrouping:'always' });
  fmtEUR0 = new Intl.NumberFormat(loc, { style:'currency', currency:'EUR', maximumFractionDigits:0, minimumFractionDigits:0, useGrouping:'always' });
  fmtNum2 = new Intl.NumberFormat(loc, { minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:'always' });
  fmtPct = new Intl.NumberFormat(loc, { style:'percent', maximumFractionDigits:0 });
  fmtPctSigned = new Intl.NumberFormat(loc, { style:'percent', maximumFractionDigits:0, signDisplay:'exceptZero' });
  const clean = s => s.replace(/\.$/, '');
  MONTHS = Array.from({ length:12 }, (_, i) => new Intl.DateTimeFormat(loc, { month:'long' }).format(new Date(2026, i, 1)));
  MONTHS_SHORT = Array.from({ length:12 }, (_, i) => clean(new Intl.DateTimeFormat(loc, { month:'short' }).format(new Date(2026, i, 1))));
  DAYS = Array.from({ length:7 }, (_, i) => new Intl.DateTimeFormat(loc, { weekday:'long' }).format(new Date(2026, 0, 4 + i)));
  DAYS_SHORT = Array.from({ length:7 }, (_, i) => clean(new Intl.DateTimeFormat(loc, { weekday:'short' }).format(new Date(2026, 0, 4 + i))));
  DEC_SEP = fmtNum2.formatToParts(1.5).find(p => p.type === 'decimal').value;
}

const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addMonths = (key, n) => { const [y, m] = key.split('-').map(Number); return iso(new Date(y, m - 1 + n, 1)).slice(0, 7); };
const daysInMonth = key => { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const monthName = key => MONTHS[+key.slice(5, 7) - 1];
const monthLabel = key => `${cap(monthName(key))} ${key.slice(0, 4)}`;

const NOW = new Date();
const todayISO = iso(NOW);
const yesterdayISO = iso(new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate() - 1));
const curMonth = todayISO.slice(0, 7);

const shortDate = s => { const d = parseISO(s); return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; };
const relShort = s => s === todayISO ? t('today') : s === yesterdayISO ? t('yesterday') : shortDate(s);
const dayHeader = s => {
  const d = parseISO(s);
  const short = `${DAYS_SHORT[d.getDay()]} ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`;
  if (s === todayISO) return `${t('today')} · ${short}`;
  if (s === yesterdayISO) return `${t('yesterday')} · ${short}`;
  return cap(`${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}${d.getFullYear() !== NOW.getFullYear() ? ' ' + d.getFullYear() : ''}`);
};

    trasporti:[['Benzina',45,70],['Metro',2.2,2.2],['Parcheggio',2,9],['Treno',4,14],['Taxi',12,25]],
    ristoranti:[['Caffè',1.2,2.5],['Pizzeria',18,38],['Sushi',25,48],['Pranzo lavoro',9,15],['Aperitivo',8,20]],
    casa:[['Ikea',15,90],['Detersivi',5,18],['Ferramenta',4,30]],
    salute:[['Farmacia',4,28],['Visita medica',60,110]],
    svago:[['Cinema',8,18],['Libro',12,25],['Concerto',35,60],['Museo',10,18]],
    lavoro:[['Cancelleria',3,18],['Pranzo con cliente',25,60],['Coworking',15,25],['Libro tecnico',20,45]],
    altro:[['Regalo',15,50],['Parrucchiere',15,30],['Lavanderia',8,16]]
  };
  const W = [['spesa',.25],['ristoranti',.29],['trasporti',.18],['casa',.07],['salute',.05],['svago',.07],['lavoro',.06],['altro',.03]];
  const pick = () => { let x = r(); for (const [k, w] of W) { if ((x -= w) <= 0) return k; } return 'altro'; };
  const start = new Date(NOW.getFullYear(), NOW.getMonth() - 2, 1);
  const end = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const ds = iso(d), dom = d.getDate();
    const n = r() < .12 ? 0 : 1 + Math.floor(r() * 2.6);
    for (let i = 0; i < n; i++) {
      const cat = pick(); const arr = T[cat]; const [note, min, max] = arr[Math.floor(r() * arr.length)];
      const x = r();
      out.push({ id:id++, amount:Math.round((min + r() * (max - min)) * 100), cat, date:ds, note:r() < .88 ? note : '',
                 pay: x < .72 ? 'carta' : x < .94 ? 'contanti' : 'altro', recurring:false });
    }
    if (ds === todayISO && n === 0) out.push({ id:id++, amount:250, cat:'ristoranti', date:ds, note:'Caffè', pay:'contanti', recurring:false });
    if (dom === 1) out.push({ id:id++, amount:3900, cat:'salute', date:ds, note:'Palestra', pay:'carta', recurring:true });
    if (dom === 3) out.push({ id:id++, amount:3500, cat:'lavoro', date:ds, note:'Coworking', pay:'carta', recurring:true });
    if (dom === 5) out.push({ id:id++, amount:1299, cat:'abbonamenti', date:ds, note:'Netflix', pay:'carta', recurring:true });
    if (dom === 12) out.push({ id:id++, amount:1199, cat:'abbonamenti', date:ds, note:'Spotify', pay:'carta', recurring:true });
    if (dom === 20) out.push({ id:id++, amount:5200 + Math.round(r() * 2400), cat:'casa', date:ds, note:'Bolletta luce', pay:'altro', recurring:true });
  }
  return out;
}

function addMissingBuiltins(s) {
  for (const d of DEFAULT_CATS) {
    const names = Object.values(STR).map(x => x.cat[d.id].toLowerCase());
    if (s.cats.some(c => c.id === d.id || names.includes(c.name.toLowerCase()))) continue;
    const i = s.cats.findIndex(c => c.id === 'altro');
    s.cats.splice(i < 0 ? s.cats.length : i, 0, { ...d, color:[...d.color], archived:false });

}

function monthStats(key) {
  const list = inMonth(key), total = sum(list), days = daysInMonth(key);
  const isCur = key === curMonth, dayN = NOW.getDate();
  const prevKey = addMonths(key, -1);
  let prevList = inMonth(prevKey);
  if (isCur) prevList = prevList.filter(e => +e.date.slice(8) <= dayN);
  const prev = sum(prevList);
  const byCat = S.cats.map(c => ({ cat:c, total:sum(list.filter(e => e.cat === c.id)) }))
                      .filter(x => x.total > 0).sort((a, b) => b.total - a.total);
  const daily = Array.from({ length:days }, (_, i) => sum(list.filter(e => +e.date.slice(8) === i + 1)));
  const elapsed = isCur ? dayN : key < curMonth ? days : 0;
  return { key, list, total, prev, prevKey, delta:prev ? (total - prev) / prev : null, byCat, daily, days, elapsed, isCur };
}

function donutSVG(st) {
  const R = 78, C = 2 * Math.PI * R, SW = 22;
  if (!st.total) return `<svg class="donut" viewBox="0 0 212 212"><circle cx="106" cy="106" r="${R}" fill="none" style="stroke:var(--fill2)" stroke-width="${SW}"/></svg>`;
  const multi = st.byCat.length > 1, gap = multi ? 5 : 0; let off = 0;
  const segs = st.byCat.map(x => {
    const len = x.total / st.total * C;
    const sel = ui.chartCat === x.cat.id, dim = ui.chartCat && !sel;
    const sw = sel ? SW + 8 : dim ? SW - 6 : SW;
    /* estremi arrotondati: la lunghezza visiva è dash + spessore */
    const dash = multi ? Math.max(.01, len - gap - sw) : C;
    const s = `<circle cx="106" cy="106" r="${R}" fill="none" stroke="${colorOf(x.cat)}" stroke-width="${sw}" stroke-linecap="${multi ? 'round' : 'butt'}"
      stroke-dasharray="${dash} ${C - dash}" stroke-dashoffset="${-(off + (multi ? sw / 2 + gap / 2 : 0))}" opacity="${dim ? .3 : 1}" data-action="chart-cat" data-cat="${x.cat.id}"><title>${esc(catName(x.cat))}</title></circle>`;
    off += len; return s;
  });
  return `<svg class="donut" viewBox="0 0 212 212"><circle cx="106" cy="106" r="${R}" fill="none" style="stroke:var(--fill2)" stroke-width="${SW}" opacity=".5"/><g transform="rotate(-90 106 106)">${segs.join('')}</g></svg>`;
}

function barsSVG(st) {
  const W = 330, H = 156, top = 16, bottom = 22, n = st.days, slot = W / n, bw = Math.max(3, slot * .64);
  const max = Math.max(...st.daily, 1), ch = H - top - bottom;
  const todayDom = st.isCur ? NOW.getDate() : -1;
  let out = `<defs><linearGradient id="barG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--tint)" stop-opacity=".75"/><stop offset="1" style="stop-color:var(--tint)" stop-opacity=".28"/></linearGradient></defs>`;
  st.daily.forEach((v, i) => {
    const day = i + 1, x = i * slot + (slot - bw) / 2, future = st.isCur && day > todayDom;
    const h = v ? Math.max(4, v / max * ch) : 0, y = H - bottom - h;
    const sel = ui.chartDay === day;
    const fill = sel || (day === todayDom && !ui.chartDay) ? 'var(--tint)' : ui.chartDay ? 'var(--bar-neutral)' : 'url(#barG)';
    if (future) out += `<circle cx="${x + bw / 2}" cy="${H - bottom - 2}" r="1.4" style="fill:var(--label3)"/>`;
    else if (v) out += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="${Math.min(4, bw / 2)}" style="fill:${fill}"/>`;
    else out += `<rect x="${x}" y="${H - bottom - 2}" width="${bw}" height="2" rx="1" style="fill:var(--fill2)"/>`;
    if (!future) out += `<rect x="${i * slot}" y="0" width="${slot}" height="${H}" fill="transparent" data-action="chart-day" data-day="${day}" style="cursor:pointer"/>`;
  });
  if (st.elapsed && st.total) {
    const avg = st.total / st.elapsed, y = H - bottom - avg / max * ch;
    out += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--label2)" stroke-width="1" stroke-dasharray="3 4" opacity=".7" pointer-events="none"/>
      <text x="${W}" y="${y - 5}" text-anchor="end" font-size="10" font-weight="600" style="fill:var(--label2)" pointer-events="none">${t('avg')}</text>`;
  }
  [1, 8, 15, 22, 29].filter(d => d <= n).forEach(d => {
    out += `<text x="${(d - 1) * slot + slot / 2}" y="${H - 5}" text-anchor="middle" font-size="11" font-weight="500" style="fill:var(--label2)">${d}</text>`;
  });
  return `<svg class="bars" viewBox="0 0 ${W} ${H}">${out}</svg>`;
}

/* ================= Swipe ================= */
const SWIPE_W = 156;
function setSwipe(row, open) {
  row.classList.toggle('open', open);
  clearTimeout(row._rt);
  if (open) row.classList.add('reveal'); else row._rt = setTimeout(() => row.classList.remove('reveal'), 340);
  row.querySelector('.swipe-content').style.transform = open ? `translateX(${-SWIPE_W}px)` : '';
}
function bindSwipes() {
  $$('.swipe', pageEl).forEach(row => {
    const content = row.querySelector('.swipe-content');
    let sx = 0, sy = 0, base = 0, dx = 0, active = false, mode = null, pid = null;
    content.addEventListener('pointerdown', e => {
      if (e.button) return;
      active = true; mode = null; sx = e.clientX; sy = e.clientY; pid = e.pointerId;
      base = row.classList.contains('open') ? -SWIPE_W : 0; dx = base;
    });
    content.addEventListener('pointermove', e => {
      if (!active || e.pointerId !== pid) return;
      const mx = e.clientX - sx, my = e.clientY - sy;
      if (!mode) {
        if (Math.abs(mx) < 7 && Math.abs(my) < 7) return;
        mode = Math.abs(mx) > Math.abs(my) ? 'h' : 'v';
        if (mode === 'h') {
          try { content.setPointerCapture(pid); } catch { /* ignora */ }
          content.style.transition = 'none'; clearTimeout(row._rt); row.classList.add('reveal');
          $$('.swipe.open', pageEl).forEach(r => r !== row && setSwipe(r, false));
        }
      }
      if (mode === 'h') {
        let x = base + mx;
        if (x > 0) x *= .2;
        if (x < -SWIPE_W) x = -SWIPE_W + (x + SWIPE_W) * .35;
        dx = x; content.style.transform = `translateX(${x}px)`;
      }
    });
    const end = e => {
      if (!active || e.pointerId !== pid) return;
      active = false;
      if (mode === 'h') {
        content.style.transition = '';
        if (dx < -SWIPE_W - 70) { setSwipe(row, false); deleteExpense(+row.dataset.id); }
        else setSwipe(row, dx < -SWIPE_W / 2);
      } else if (!mode && e.type === 'pointerup') {
        if (row.classList.contains('open')) setSwipe(row, false);
        else { const exp = S.expenses.find(x => x.id === +row.dataset.id); if (exp) openAdd(exp); }
      }
      mode = null;
    };
    content.addEventListener('pointerup', end);
    content.addEventListener('pointercancel', end);
  });
}

/* ---- Esportazione (CSV sempre nel formato italiano previsto dalla proposta) ---- */
const fmtCSV = new Intl.NumberFormat('it-IT', { minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:false });
function buildExport(kind) {
  const date = todayISO;
  if (kind === 'csv') {
    const q = s => `"${String(s).replace(/"/g, '""')}"`;
    const rows = [...S.expenses].sort(byDateDesc).map(e => [e.date, q(catById(e.cat).name), fmtCSV.format(e.amount / 100), q(e.note), STR.it.pay[e.pay] || '', e.recurring ? 'sì' : 'no'].join(';'));
    return { name:`spese-${date}.csv`, type:'text/csv', content:'﻿' + ['data;categoria;importo_eur;descrizione;metodo;ricorrente', ...rows].join('\n') };
  }
  return { name:`spese-backup-${date}.json`, type:'application/json', content:JSON.stringify({ app:'spese', schemaVersion:1, exportedAt:new Date().toISOString(),
    categories:S.cats.map(({ id, name, icon, color, builtin, archived }) => ({ id, name, icon, colorLight:color[0], colorDark:color[1], builtin, archived })),
    expenses:S.expenses.map(({ id, amount, cat, date, note, pay, recurring }) => ({ id, amountCents:amount, categoryId:cat, date, note, paymentMethod:pay, recurring })) }, null, 2) };
}
function markBackup() { S.lastBackup = todayISO; persist(); if (ui.tab === 'settings') render(); }
function openExport(kind) {
  const { name, content, type } = buildExport(kind);
  const file = new File([content], name, { type });
  const kb = (file.size / 1024).toLocaleString(t('locale'), { maximumFractionDigits:1 });
  let canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files:[file] })); } catch { canShare = false; }
  const buttons = [];
  if (canShare) buttons.push({ label:t('share'), fn:() => {
    closeSheet();
    navigator.share({ files:[file], title:name })
      .then(() => { markBackup(); toast(t('shared')); })
      .catch(e => { if (e.name !== 'AbortError') toast(t('shareFail')); });
  } });
  buttons.push({ label:t('download'), fn:() => {
    closeSheet();
    const url = URL.createObjectURL(file), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    markBackup(); toast(t('downloaded', name));
  } });
  buttons.push({ label:t('copy'), fn:() => {
    closeSheet();
    navigator.clipboard.writeText(content).then(() => { markBackup(); toast(t('copied')); }).catch(() => toast(t('copyFail')));
  } });
  openSheet('confirm', { title:kind === 'csv' ? t('exportExcel') : t('exportBackup'), msg:`${name} · ${kb} KB`, buttons });
}

const HEX = /^#[0-9a-f]{6}$/i;
function parseBackup(text) {
  const d = JSON.parse(text);
  if (!d || d.app !== 'spese' || !Array.isArray(d.expenses) || !Array.isArray(d.categories)) throw new Error('formato');
  const cats = d.categories.filter(c => c && c.id && c.name).map(c => ({
    id:String(c.id).slice(0, 40), name:String(c.name).slice(0, 20), icon:CAT_ICONS.includes(c.icon) ? c.icon : 'dots',
    color:[HEX.test(c.colorLight) ? c.colorLight : '#8E8E93', HEX.test(c.colorDark) ? c.colorDark : (HEX.test(c.colorLight) ? c.colorLight : '#98989D')],
    builtin:!!c.builtin, archived:!!c.archived }));
  const exps = d.expenses.filter(e => e && Number.isInteger(e.amountCents) && e.amountCents > 0 && /^\d{4}-\d{2}-\d{2}$/.test(e.date)).map(e => ({
    amount:e.amountCents, cat:String(e.categoryId), date:e.date, note:String(e.note || '').slice(0, 40),
    pay:PAY_ICON[e.paymentMethod] ? e.paymentMethod : 'altro', recurring:!!e.recurring }));
  return { cats, exps };
}
function importReplace(b) {
  const cats = b.cats.length ? b.cats : DEFAULT_CATS.map(c => ({ ...c, color:[...c.color], archived:false }));
  if (!cats.some(c => c.id === 'altro')) { const a = DEFAULT_CATS.find(c => c.id === 'altro'); cats.push({ ...a, color:[...a.color], archived:false }); }
  const ids = new Set(cats.map(c => c.id));
  S.cats = cats;
  S.expenses = b.exps.map((e, i) => ({ id:i + 1, ...e, cat:ids.has(e.cat) ? e.cat : 'altro' }));
  S.nextId = S.expenses.length + 1;
  persist(); closeSheet(); ui.filters = defaultFilters(); render();
  toast(t('restored', S.expenses.length));
}
function importMerge(b) {
  const idMap = {};
  for (const c of b.cats) {
    const same = S.cats.find(x => x.id === c.id) || S.cats.find(x => x.name.toLowerCase() === c.name.toLowerCase());
    if (same) idMap[c.id] = same.id; else { S.cats.push(c); idMap[c.id] = c.id; }
  }
  const key = e => `${e.date}|${e.amount}|${e.cat}|${e.note}`;
  const existing = new Set(S.expenses.map(key));
  let added = 0;
  for (const e of b.exps) {
    const ne = { ...e, cat:idMap[e.cat] || (S.cats.some(c => c.id === e.cat) ? e.cat : 'altro') };
    if (existing.has(key(ne))) continue;
    existing.add(key(ne)); S.expenses.push({ id:S.nextId++, ...ne }); added++;
  }
  persist(); closeSheet(); render();
  toast(added ? t('addedN', added) : t('noneNew'));
}
$('#importInput').addEventListener('change', async ev => {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  try {
    const b = parseBackup(await f.text());
    openSheet('confirm', { title:t('importBackup'), msg:`${esc(f.name)}<br>${t('nExp', b.exps.length)} · ${t('nCats', b.cats.length)}`, buttons:[
      { label:t('merge'), fn:() => importMerge(b) },
      { label:t('replace'), danger:true, fn:() => importReplace(b) }
    ] });
  } catch { toast(t('invalid')); }
});
